name: Chat AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Test & Build (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: node --test test/utils.test.js test/secretBox.test.js

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check i18n Locales Integrity
        working-directory: ./frontend
        run: npm run check:locales

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build
